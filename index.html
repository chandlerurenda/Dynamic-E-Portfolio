<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chandler Urenda</title>
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://kit.fontawesome.com/025fb6f23f.js"
      crossorigin="anonymous"
    ></script>
    <script src="app.js"></script>
  </head>
  <body>
    <section id="landing-page">
      <nav>
        <figure>
          <img id="personal-logo" src="./assets/CUlogo.svg" alt="" />
        </figure>
        <ul class="nav__link--list">
          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-efect--black"
              >About</a
            >
          </li>

          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-efect--black"
              >Projects</a
            >
          </li>

          <li class="nav__link">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-efect--black"
              >Contact</a
            >
          </li>
          <li class="nav__link click">
            <a
              href="#"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              ><i class="fa-solid fa-circle-half-stroke"></i
            ></a>
          </li>
        </ul>
      </nav>
      <header>
      <header class="header">
        <div class="header__content">
          <h1 class="title">Hey</h1>
          <h1 class="title orange">I'm Chandler.</h1>
          <p class="header__para">
            I'm a <b class="orange">Frontend Software Engineer</b> with a
            passion for making the user experience amazing. Websites and web
            applications are my field, and I aim to please.
          </p>
          <br />
          <p class="header__para">
            Here's a bit more <b class="orange">about me.</b>
          </p>
          <div class="social__list">
            <a href="https://google.com" target="_blank" class="social__link click">
              <i class="fa-brands fa-discord"></i>
            </a>
            <a href="https://github.com/chandlerurenda" class="social__link click">
              <i class="fa-brands fa-github"></i>
            </a>
            <a href="./assets/Chandler_Urenda_Resume.pdf" target="_blank" class="social__link click">
              <i class="fa-solid fa-file-pdf"></i>
            </a>
          </div>
        </div>
      </header>
      <button class="mail__btn click">
        <i class="fa-solid fa-envelope"></i>
      </button>
      <a href="#projects" class="scroll">
        <div class="scroll__icon click"></div>

      </a>
    </section>
  </body>
